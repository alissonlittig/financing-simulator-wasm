[package]
name = "financing-simulator"
version = "0.1.0"
edition = "2021"
description = "SAC vs Price loan simulator in Rust, compiled to WebAssembly with Leptos"
license = "MIT"

[lib]
name = "financing"
path = "src/lib.rs"

[[bin]]
name = "financing-simulator"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlAnchorElement"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
